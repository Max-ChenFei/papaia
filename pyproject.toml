[project]
name = "single-spec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "ortools>=9.14.6206",
    "requests>=2.32.5",   
    "ruff>=0.14.14",
]

[project.scripts]
single-spec = "single_spec.__main__:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.14.0",
]
example =  [
    "ipywidgets>=8.1.8",
    "langchain>=1.2.7",
    "langchain-ollama>=1.0.1",
    "pillow>=12.1.0",
    "single-spec",
    "transformers>=5.0.0",
]

