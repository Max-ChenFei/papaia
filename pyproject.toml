[project]
name = "papaia"
version = "0.1.0"
description = "Placement-agnostic tool integration for AI agents"
readme = "README.md"
authors = [
    { name = "Fei Chen", email = "boxchenfei@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "asyncssh>=2.22.0",
    "ortools>=9.14.6206",
    "requests>=2.32.5",
    "ruff>=0.14.14",
]

[project.scripts]
papaia = "papaia.__main__:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-mock>=3.14.0",
]
cigeva = [
    "langchain>=1.2.7",
    "langchain-ollama>=1.0.1",
    "langchain-mcp-adapters>=0.2.1",
    "fastmcp>=3.0.2",
    "transformers>=5.0.0",
    "pillow>=12.1.0",
    "papaia",
]
genartist = [
    "smolagents[mcp,openai]>=1.22.0",
    "gradio>=6.5.1",
    "torch",
    "diffusers>=0.36.0",
    "accelerate>=1.12.0",
    "transformers>=5.0.0",
    "pillow>=12.1.0",
    "papaia",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
